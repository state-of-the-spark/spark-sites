# Prospect Feeder — recurring lead-gen for the AI Prospect Sourcer (E-8)
#
# Scrapes a rotating Polk County category from Google Maps (Apify), keeps
# established no-website businesses, and appends the new ones to the
# "Established Leads Feed" sheet the Prospect Sourcer reads. This is the
# recurring feed behind the marketing employee.
#
# Required GitHub Secrets:
#   APIFY_TOKEN                 — Apify API token
#   GOOGLE_SERVICE_ACCOUNT_JSON — service account with Editor on the feed sheet

name: Prospect Feeder

on:
  schedule:
    - cron: "0 11 * * 1,4"   # Mon + Thu, 7:00 AM ET (EDT) — before Sourcer's runs
  workflow_dispatch:

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: agents/prospect-feeder/requirements.txt

      - name: Install dependencies
        run: pip install -r agents/prospect-feeder/requirements.txt

      - name: Run Prospect Feeder
        working-directory: agents/prospect-feeder
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python feeder.py
